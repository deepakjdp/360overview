apiVersion: v1
kind: Service
metadata:
  name: claims-assistant
  labels:
    app: claims-assistant
spec:
  selector:
    app: claims-assistant
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: claims-assistant
  labels:
    app: claims-assistant
spec:
  to:
    kind: Service
    name: claims-assistant
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
