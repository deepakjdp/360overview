apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claims-assistant
  labels:
    app: claims-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claims-assistant
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claims-assistant
  labels:
    app: claims-assistant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: claims-assistant
---
# Only the OpenShift router (ingress) and monitoring may reach the pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claims-assistant-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: claims-assistant
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: 8080
