# Alertmanager routing: send critical alerts to Slack, everything else to default.
# Edit the receivers below (Slack URL / email / PagerDuty / webhook), then apply:
#
#   oc -n openshift-monitoring create secret generic alertmanager-main \
#     --from-file=alertmanager.yaml=02-alertmanager-config.yaml \
#     --dry-run=client -o=yaml | oc -n openshift-monitoring replace -f -
#
# NOTE: this REPLACES the whole config. If you already have custom receivers, merge first:
#   oc -n openshift-monitoring get secret alertmanager-main \
#     --template='{{ index .data "alertmanager.yaml" }}' | base64 -d
global:
  resolve_timeout: 5m
route:
  receiver: default
  group_by: [namespace, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: slack-critical
    - matchers:
        - severity="warning"
      receiver: slack-warning
receivers:
  - name: default
  - name: slack-critical
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/ME/NOW
        channel: "#alerts-critical"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
  - name: slack-warning
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/ME/NOW
        channel: "#alerts-warning"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
# Email alternative (add under a receiver):
#   email_configs:
#     - to: oncall@example.com
#       from: alertmanager@example.com
